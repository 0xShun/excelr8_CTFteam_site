<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExcelR8 CTF Chat{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #000000;
            color: #00ffff;
            overflow: hidden;
            height: 100vh;
        }
        
        .terminal-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .terminal-header {
            border: 2px solid #00ffff;
            border-bottom: none;
            padding: 10px 20px;
            background-color: #001a1a;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .terminal-content {
            flex: 1;
            border: 2px solid #00ffff;
            background-color: #000000;
            padding: 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .terminal-content::-webkit-scrollbar {
            width: 10px;
        }
        
        .terminal-content::-webkit-scrollbar-track {
            background: #001a1a;
        }
        
        .terminal-content::-webkit-scrollbar-thumb {
            background: #00ffff;
        }
        
        .terminal-content::-webkit-scrollbar-thumb:hover {
            background: #00cccc;
        }
        
        .prompt {
            color: #00ff00;
        }
        
        .error {
            color: #ff0000;
        }
        
        .success {
            color: #00ff00;
        }
        
        .warning {
            color: #ffff00;
        }
        
        input[type="text"],
        input[type="password"],
        textarea {
            background-color: #001a1a;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            width: 100%;
            margin: 10px 0;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ffff;
        }
        
        button,
        .btn {
            background-color: #001a1a;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        button:hover,
        .btn:hover {
            background-color: #00ffff;
            color: #000000;
            box-shadow: 0 0 15px #00ffff;
        }
        
        button:active,
        .btn:active {
            transform: scale(0.98);
        }
        
        a {
            color: #00ffff;
            text-decoration: underline;
        }
        
        a:hover {
            color: #00ff00;
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }
        
        .info-box {
            border: 1px solid #00ffff;
            padding: 15px;
            margin: 10px 0;
            background-color: #001a1a;
        }
        
        .message {
            padding: 5px 10px;
            margin: 5px 0;
            border-radius: 3px;
        }
        
        .message.error {
            background-color: #330000;
            border-left: 3px solid #ff0000;
        }
        
        .message.success {
            background-color: #003300;
            border-left: 3px solid #00ff00;
        }
        
        .message.warning {
            background-color: #333300;
            border-left: 3px solid #ffff00;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <span>{% block header %}ExcelR8 CTF - Terminal Chat{% endblock %}</span>
            <span class="blink">█</span>
        </div>
        <div class="terminal-content">
            {% block content %}{% endblock %}
        </div>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
